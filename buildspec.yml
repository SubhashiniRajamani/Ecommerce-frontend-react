version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies"
      - npm install --legacy-peer-deps
      - npm run build

  pre_build:
    commands:
      - echo "Loading environment variables"

artifacts:
  files:
    - '**/*'
    - appspec.yml
    - scripts/**
