version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - export $(grep -v '^#' .env | xargs)
      - echo "API URL = $REACT_APP_API_URL"

  build:
    commands:
      - npm run build

artifacts:
  files:
    - '**/*'
    - appspec.yml
    - scripts/**
